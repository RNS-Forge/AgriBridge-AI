<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgWorker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c298" />
      <stop offset="100%" stop-color="#d99b6d" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2218" />
      <stop offset="100%" stop-color="#18110b" />
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgWorker)" />

  <!-- Body / Shoulders -->
  <path d="M40 185 c0 -35 25 -55 60 -55 s60 20 60 55 v15 H40 z" fill="url(#shirt)" filter="url(#shadow)" />

  <!-- Safety Hi-Vis Vest -->
  <path d="M62 135 L80 185 L94 185 L84 133 z" fill="url(#vest)" />
  <path d="M138 135 L120 185 L106 185 L116 133 z" fill="url(#vest)" />
  <!-- Reflective Silver Stripes -->
  <path d="M68 145 L74 165 L84 165 L78 145 z" fill="#f1f5f9" />
  <path d="M132 145 L126 165 L116 165 L122 145 z" fill="#f1f5f9" />

  <!-- Neck -->
  <path d="M86 108 h28 v28 c0 8 -6 14 -14 14 s-14 -6 -14 -14 z" fill="#d99b6d" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="88" rx="30" ry="36" fill="url(#skin)" filter="url(#shadow)" />

  <!-- Hair / Field Cap -->
  <path d="M68 80 c0 -25 15 -38 32 -38 s32 13 32 38 c-10 -8 -22 -10 -32 -10 s-22 2 -32 10 z" fill="url(#hair)" />
  <!-- Modern Field Cap -->
  <path d="M66 70 c0 -18 15 -30 34 -30 s34 12 34 30 c-14 -4 -34 -4 -68 0 z" fill="#0284c7" />
  <path d="M62 68 c18 -4 48 -4 76 0 c8 1 12 6 10 10 c-2 3 -12 4 -28 3 c-20 -1 -40 0 -58 4 z" fill="#0369a1" />

  <!-- Ears -->
  <ellipse cx="69" cy="90" rx="5" ry="8" fill="#d99b6d" />
  <ellipse cx="131" cy="90" rx="5" ry="8" fill="#d99b6d" />

  <!-- Eyebrows -->
  <path d="M80 78 q10 -3 16 1" stroke="#2d2218" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M120 78 q-10 -3 -16 1" stroke="#2d2218" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="87" cy="85" rx="3.5" ry="4" fill="#18110b" />
  <ellipse cx="113" cy="85" rx="3.5" ry="4" fill="#18110b" />
  <circle cx="86" cy="83.5" r="1.2" fill="#ffffff" />
  <circle cx="112" cy="83.5" r="1.2" fill="#ffffff" />

  <!-- Nose -->
  <path d="M100 84 v12 q-3 3 0 5 h4" stroke="#c07e4d" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Smile -->
  <path d="M89 107 q11 9 22 0" stroke="#a45d30" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
