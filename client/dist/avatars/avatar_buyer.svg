<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgBuyer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="skinB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d7bb" />
      <stop offset="100%" stop-color="#e0b08c" />
    </linearGradient>
    <linearGradient id="suitB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tieB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgBuyer)" />

  <!-- Body / Suit Jacket -->
  <path d="M38 185 c0 -35 25 -52 62 -52 s62 17 62 52 v15 H38 z" fill="url(#suitB)" filter="url(#shadowB)" />

  <!-- White Shirt Triangle -->
  <path d="M84 133 L100 185 L116 133 z" fill="#ffffff" />

  <!-- Tie -->
  <path d="M96 136 L104 136 L106 175 L100 185 L94 175 z" fill="url(#tieB)" />
  <polygon points="95,134 105,134 103,142 97,142" fill="#3730a3" />

  <!-- Suit Lapels -->
  <path d="M58 135 L84 185 L98 135 L76 133 z" fill="#1e293b" />
  <path d="M142 135 L116 185 L102 135 L124 133 z" fill="#1e293b" />

  <!-- Neck -->
  <path d="M86 106 h28 v28 c0 7 -6 12 -14 12 s-14 -5 -14 -12 z" fill="#e0b08c" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="86" rx="29" ry="35" fill="url(#skinB)" filter="url(#shadowB)" />

  <!-- Professional Hair Cut -->
  <path d="M70 78 c-2 -28 18 -42 36 -42 c18 0 28 10 28 26 c0 14 -4 18 -6 18 c-3 0 -6 -12 -14 -12 c-8 0 -18 6 -24 8 z" fill="#1e1b18" />

  <!-- Ears -->
  <ellipse cx="70" cy="88" rx="4.5" ry="7.5" fill="#e0b08c" />
  <ellipse cx="130" cy="88" rx="4.5" ry="7.5" fill="#e0b08c" />

  <!-- Glasses -->
  <rect x="76" y="77" width="20" height="15" rx="3" stroke="#475569" stroke-width="2" fill="none" />
  <rect x="104" y="77" width="20" height="15" rx="3" stroke="#475569" stroke-width="2" fill="none" />
  <path d="M96 83 h8" stroke="#475569" stroke-width="2" />
  <path d="M76 81 L70 83" stroke="#475569" stroke-width="2" />
  <path d="M124 81 L130 83" stroke="#475569" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <ellipse cx="86" cy="84.5" rx="3" ry="3.5" fill="#0f172a" />
  <ellipse cx="114" cy="84.5" rx="3" ry="3.5" fill="#0f172a" />
  <circle cx="85" cy="83" r="1" fill="#ffffff" />
  <circle cx="113" cy="83" r="1" fill="#ffffff" />

  <!-- Nose -->
  <path d="M100 85 v11 q-2 2 0 4 h3" stroke="#bd865e" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Smile -->
  <path d="M89 107 q11 8 22 0" stroke="#9e663f" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
