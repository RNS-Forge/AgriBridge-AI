<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMaker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="skinAM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d4b6" />
      <stop offset="100%" stop-color="#dfa87f" />
    </linearGradient>
    <linearGradient id="shirtAM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadowAM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgMaker)" />

  <!-- Body / Crisp Formal Shirt -->
  <path d="M38 185 c0 -35 25 -52 62 -52 s62 17 62 52 v15 H38 z" fill="url(#shirtAM)" filter="url(#shadowAM)" />

  <!-- Shirt Collar -->
  <polygon points="100,135 82,126 92,150" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="100,135 118,126 108,150" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <!-- Center Placket -->
  <line x1="100" y1="135" x2="100" y2="185" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="100" cy="155" r="1.5" fill="#94a3b8" />
  <circle cx="100" cy="170" r="1.5" fill="#94a3b8" />

  <!-- Lanyard Neck Straps (Purple) -->
  <path d="M84 133 L94 175" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
  <path d="M116 133 L106 175" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
  <!-- ID Badge -->
  <rect x="91" y="174" width="18" height="18" rx="2" fill="#4a2e80" />
  <circle cx="100" cy="179" r="2" fill="#ffffff" />
  <rect x="94" y="184" width="12" height="2" rx="1" fill="#c084fc" />

  <!-- Neck -->
  <path d="M86 106 h28 v28 c0 7 -6 12 -14 12 s-14 -5 -14 -12 z" fill="#dfa87f" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="86" rx="28" ry="34" fill="url(#skinAM)" filter="url(#shadowAM)" />

  <!-- Stylish Modern Hair -->
  <path d="M72 76 c0 -28 16 -40 34 -40 c18 0 24 10 24 22 c0 14 -4 18 -6 18 c-3 0 -5 -10 -12 -10 c-10 0 -22 6 -28 10 z" fill="#18181b" />

  <!-- Ears -->
  <ellipse cx="71" cy="88" rx="4.5" ry="7.5" fill="#dfa87f" />
  <ellipse cx="129" cy="88" rx="4.5" ry="7.5" fill="#dfa87f" />

  <!-- Eyebrows -->
  <path d="M82 77 q8 -3 14 0" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M118 77 q-8 -3 -14 0" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="88" cy="84" rx="3.2" ry="3.8" fill="#18181b" />
  <ellipse cx="112" cy="84" rx="3.2" ry="3.8" fill="#18181b" />
  <circle cx="87" cy="82.5" r="1.1" fill="#ffffff" />
  <circle cx="111" cy="82.5" r="1.1" fill="#ffffff" />

  <!-- Nose -->
  <path d="M100 84 v11 q-2 2 0 4 h3" stroke="#b57a50" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Smile -->
  <path d="M90 106 q10 8 20 0" stroke="#96562a" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
